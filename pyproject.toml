[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "craft-dev"
dynamic = ["version"]
description = "nbdev fastcdp auth, debugging, and testing toolkit for solve-it-crafts"
requires-python = ">=3.11"
dependencies = [
    "fastcore>=1.7.0",
    "fastcdp>=0.0.28",
    "fast5ever>=0.1.7",
]

[project.scripts]
craft-pw = "craft_dev.cli:main"
craft-cdp = "craft_dev.cli:main"

[dependency-groups]
dev = [
    "nbdev>=3.0",
]

[tool.nbdev]
lib_path = "craft_dev"
nbs_path = "nbs"
doc_path = "_docs"
tst_flags = "notest live"
put_version_in_init = true

[tool.setuptools.packages.find]
include = ["craft_dev*"]

[tool.setuptools.dynamic]
version = { attr = "craft_dev.__version__" }

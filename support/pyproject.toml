[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "craft-support"
dynamic = ["version"]
description = "Bug-to-review-app support workflow for solve-it-crafts"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "agus"}]
classifiers = ["Programming Language :: Python :: 3", "Programming Language :: Python :: 3 :: Only"]
dependencies = [
    "fastcore>=1.7.0",
    "fastgws>=0.2.12",
    "solvedrive @ git+https://github.com/AnswerDotAI/solvedrive.git@main",
    "fast5ever>=0.1.7",
    "fastgit>=0.1.4",
    "ghapi>=2.1.5",
    "fastcdp>=0.0.28",
    "python-fasthtml>=0.12.0",
    "textual>=1.0.0",
    "rich>=13.0.0",
]

[project.scripts]
craft-support = "craft_support.cli:main"

[project.optional-dependencies]
dev = ["nbdev>=3.0", "fastship", "build", "twine", "pytest>=8.0", "pytest-asyncio>=0.24", "httpx>=0.27"]

[tool.nbdev]
lib_path = "craft_support"
nbs_path = "nbs"
doc_path = "_docs"
tst_flags = "notest live"
put_version_in_init = true

[project.urls]
Homepage = "https://github.com/abiancar/solve-it-crafts"
Repository = "https://github.com/abiancar/solve-it-crafts"
Issues = "https://github.com/abiancar/solve-it-crafts/issues"

[tool.fastship]
branch = "main"

[tool.setuptools.dynamic]
version = { attr = "craft_support.__version__" }

[tool.setuptools.packages.find]
include = ["craft_support"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
